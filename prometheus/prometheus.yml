global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics
    params:
      collect[]:
        - pg_stat_statements
        - pg_stat_user_tables
        - pg_stat_database
        - pg_stat_activity

  - job_name: 'dba-ai-agent'
    static_configs:
      - targets: ['dba-ai-agent:8002']
    metrics_path: /metrics