# template.manifest.yaml
#
# Declares (a) the placeholder variables init.sh substitutes, (b) the tier of
# every templated file, and (c) where each file originated upstream, so
# improvements can be synced forward instead of drifting.
#
# Tiers:
#   1 = universal   — copied verbatim into every project
#   2 = templated   — copied with {{PLACEHOLDER}} substitution
#   3 = opt-in      — under modules/, installed only when enabled

version: 2

# ---------------------------------------------------------------------------
# Placeholders. init.sh prompts for each (or takes --set KEY=VALUE) and
# substitutes {{KEY}} across every tier-2 file.
# ---------------------------------------------------------------------------
placeholders:
  PROJECT_NAME:
    prompt: "Project name"
    default: ""
  PROJECT_TAGLINE:
    prompt: "One-line description (shown at the top of CLAUDE.md/AGENTS.md)"
    default: ""
  AGENT_NAME:
    prompt: "Agent identity name for SOUL.md"
    default: "Agent"
  AGENT_DOMAIN:
    prompt: "What the agent works on, e.g. 'on payment systems'"
    default: "on this codebase"
  AGENT_STAKES:
    prompt: "What is actually at stake when this system is wrong (one sentence)"
    default: "Correctness here is what users depend on."
  STACK:
    prompt: "Stack, e.g. 'Python 3.11, pytest (async)' or 'TypeScript, Vitest'"
    default: ""
  CORE_PATTERN:
    prompt: "The project's core pattern, one line"
    default: ""
  ENDPOINT_REGISTRY:
    prompt: "Path to the single-source-of-truth interface registry module"
    default: "src/config/endpoints"
  BUG_DOC_DIR:
    prompt: "Directory holding defect docs"
    default: "docs/bugs/"
  TRACKER:
    prompt: "External tracker name (or 'none')"
    default: "none"
  DEFAULT_BRANCH:
    prompt: "Protected/default branch"
    default: "main"
  INSTALL_CMD:
    prompt: "Install dependencies"
    default: ""
  TEST_CMD:
    prompt: "Run the whole suite"
    default: ""
  TEST_SINGLE_CMD:
    prompt: "Run a single test file"
    default: ""
  LINT_CMD:
    prompt: "Lint"
    default: ""
  TYPECHECK_CMD:
    prompt: "Type check (or 'true' if none)"
    default: "true"
  UNIT_TEST_CMD:
    prompt: "Unit tests that need no external dependencies"
    default: ""
  COLLECT_CMD:
    prompt: "Dry-run/collect-only smoke (or 'true' if none)"
    default: "true"

# ---------------------------------------------------------------------------
# File tiers
# ---------------------------------------------------------------------------
files:
  tier1:
    # GRAPH_FIRST.md is NOT here — it ships with the code-review-graph module,
    # so the rule and the MCP wiring always arrive together.
    - .claude/hooks/scripts/edit-time-lint.py
    - .claude/hooks/scripts/codex-precommit-review.py
    - .claude/hooks/codex-review-schema.json
    - .claude/agents/
    - .claude/commands/git-operations/
    - .claude/commands/code-quality/
    - .claude/commands/workflow/

  tier2:
    - CLAUDE.md
    - AGENTS.md
    - GEMINI.md
    - SOUL.md
    - .claude/settings.json
    # These carry placeholders, so they are templated, not verbatim. init.sh
    # scans the whole tree for {{TOKENS}} rather than reading these lists, so a
    # file listed under tier1 while containing a placeholder is a lie.
    - .claude/rules/KARPATHY.md
    - .claude/hooks/scripts/enforce-workflow.py
    - .claude/hooks/scripts/guard-protected-branch.sh
    - .claude/rules/VALIDATION_RULES.md
    - .claude/rules/TESTING_STANDARD.md
    - .claude/rules/CODEBASE_EXPLORATION.md
    - .claude/rules/ERROR_CONTRACT_POLICY.md
    - .claude/rules/BUG_TEST_LINKAGE.md
    - .claude/skills/local-gate/SKILL.md
    - .claude/hooks/scripts/session-start-reminder.py
    - tools/local_gate.sh
    - .cursorrules
    - .windsurfrules
    - .kiro/steering/project.md

  tier3_modules:
    qa-python:
      description: "pytest/async patterns, oracle factories, CSV data-driven tests, money-path oracle lint"
      default: false
    notion-tracker:
      description: "/bug-sync — mirror defect docs to a Notion database via the REST API"
      default: false
    code-review-graph:
      description: "code-review-graph MCP wiring + the GRAPH_FIRST rule"
      default: false
    k8s-infra:
      description: "cluster log access, port-forward preflight, live-env connectivity checks"
      default: false
    metrics-grafana:
      description: "metrics DB schema, run ingest, dashboards, weekly digest"
      default: false
    archon:
      description: "Archon task management + PRP command set"
      default: false

# ---------------------------------------------------------------------------
# Upstream provenance — used by scripts/sync-from-source.sh to pull
# improvements forward from the repo this template was distilled from.
# ---------------------------------------------------------------------------
upstream:
  # Set to the local path of the reference implementation.
  source_repo: ""

  # `mapping` — <template path>: <upstream path>. Sync REPORTS drift for every
  # pair here and shows the diff. It does NOT overwrite unless the path is also
  # in `overwrite_allowed` below.
  mapping:
    .claude/hooks/codex-review-schema.json: .claude/hooks/codex-review-schema.json
    .claude/rules/KARPATHY.md: .claude/rules/KARPATHY.md
    .claude/rules/VALIDATION_RULES.md: .claude/rules/QA_VALIDATION.md
    .claude/rules/TESTING_STANDARD.md: .claude/rules/TESTING_RULES.md
    .claude/rules/CODEBASE_EXPLORATION.md: .claude/rules/CODEBASE_EXPLORATION.md
    .claude/rules/ERROR_CONTRACT_POLICY.md: .claude/rules/BACKEND_RESPONSE_CODES.md
    .claude/rules/BUG_TEST_LINKAGE.md: .claude/rules/BUG_TEST_LINKAGE.md
    modules/code-review-graph/files/.claude/rules/GRAPH_FIRST.md: .claude/rules/GRAPH_FIRST.md
    tools/local_gate.sh: tools/local_gate.sh
    .claude/hooks/scripts/enforce-workflow.py: .claude/hooks/scripts/enforce-workflow.py
    .claude/hooks/scripts/edit-time-lint.py: .claude/hooks/scripts/edit-time-lint.py
    .claude/hooks/scripts/codex-precommit-review.py: .claude/hooks/scripts/codex-precommit-review.py

  # `overwrite_allowed` — the ONLY paths `--apply` may write. Block-by-default:
  # a file belongs here only when the template copy is byte-identical to
  # upstream and is meant to stay that way.
  #
  # Everything else in `mapping` was GENERALIZED by this template. Upstream's
  # version is project-specific — applying it would drag the original back in
  # and undo the rewrite. For those, read the reported diff, take the idea, and
  # port it by hand keeping the generalized wording.
  overwrite_allowed:
    - .claude/hooks/codex-review-schema.json

  # Never compared: no upstream counterpart, fully project-owned.
  manual_review:
    - CLAUDE.md
    - AGENTS.md
    - SOUL.md
    - GEMINI.md
    - .claude/settings.json
